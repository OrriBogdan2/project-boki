# Builds the game (Windows, macOS, Linux) and the launcher (Windows, macOS) and publishes them
# as a GitHub Release. The launcher downloads the game from the latest release.
#
# To ship a new playtest build:
#   1. bump VERSION in scripts/core/net.gd (players on different versions can't play together)
#   2. push a tag with the same version:  git tag v0.2.0 && git push origin v0.2.0
#   (or run this workflow by hand from the Actions tab and type the version)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v0.2.1"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        run: |
          TAG="${{ github.event.inputs.version }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          CODE=$(grep -oP 'const VERSION := "\K[^"]+' scripts/core/net.gd)
          echo "Game network version: $CODE, tag: $TAG"
          if [ "v$CODE" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match VERSION \"$CODE\" in scripts/core/net.gd. Bump one so they match."
            exit 1
          fi

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf tpl tpl.tpz godot.zip

      - name: Import
        run: |
          godot --headless --path . --import || true
          (cd launcher && godot --headless --path . --import || true)

      - name: Check scripts
        run: |
          godot --headless --path . -- --check | tee check.log
          grep -q "failures: 0" check.log
          python3 -m unittest discover -s server/matchmaker/tests

      # Crash and error reporting (docs/SENTRY.md): after the checks (they run without the addon, like the suite),
      # fetch the pinned Sentry addon and write the DSN secret into project.godot for this export only.
      - name: Sentry addon and DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -e
          tools/sentry_addon.sh
          godot --headless --path . --import || true
          python3 -I tools/sentry_dsn.py

      - name: Export game
        run: |
          set -e
          mkdir -p ../build/win ../build/mac ../build/linux
          godot --headless --path . --export-release "Windows" ../build/win/ProjectBoki.exe
          godot --headless --path . --export-release "macOS" ../build/mac/ProjectBoki.zip
          godot --headless --path . --export-release "Linux" ../build/linux/ProjectBoki.x86_64
          mkdir -p dist
          (cd ../build/win && zip -qr "$GITHUB_WORKSPACE/dist/ProjectBoki-windows.zip" .)
          cp ../build/mac/ProjectBoki.zip dist/ProjectBoki-macos.zip
          (cd ../build/linux && zip -qr "$GITHUB_WORKSPACE/dist/ProjectBoki-linux.zip" .)

      # The Sentry release and the native debug files (unwind info for the exported binaries and the addon's libraries;
      # the official export templates carry no symbols, see docs/SENTRY.md). Skipped without SENTRY_AUTH_TOKEN.
      - name: Sentry release and debug files
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: project-boki
          SENTRY_PROJECT: project-boki
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "::warning::SENTRY_AUTH_TOKEN secret not set; skipping the Sentry upload"; exit 0; fi
          REL="project-boki@${TAG#v}"   # the same name CrashReport.release_name() sends
          CLI="npx --yes @sentry/cli@2.39.1"
          $CLI releases new "$REL"
          $CLI releases set-commits "$REL" --auto --ignore-missing || true
          $CLI debug-files upload ../build/win ../build/linux addons/sentry/bin || echo "::warning::debug-files upload failed"
          $CLI releases finalize "$REL"

      # The dedicated server: a build artifact only (S2 deploys it by hand with server/deploy/push.sh), never
      # a release asset and never auto-deployed. The "Linux Server" preset is in export_presets.cfg.
      - name: Export Linux Server
        run: |
          set -e
          mkdir -p ../build/server
          godot --headless --path . --export-release "Linux Server" ../build/server/ProjectBoki.x86_64
          mkdir -p server-artifact/build
          cp -r ../build/server/. server-artifact/build/
          cp -r server/matchmaker server/deploy server/README.md server-artifact/
          find server-artifact -name __pycache__ -type d -exec rm -rf {} +

      - name: Upload the server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectBoki-linux-server-${{ steps.ver.outputs.tag }}
          path: server-artifact
          retention-days: 30
          if-no-files-found: error

      - name: Export launcher
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          BOKI_SERVER: ${{ vars.BOKI_SERVER }}
        run: |
          set -e
          cd launcher
          python3 - <<'PY'
          import json, os
          p = "launcher_config.json"
          c = json.load(open(p))
          if os.environ.get("DISCORD_CLIENT_ID"): c["discord_client_id"] = os.environ["DISCORD_CLIENT_ID"]
          if os.environ.get("BOKI_SERVER"): c["server"] = os.environ["BOKI_SERVER"]
          json.dump(c, open(p, "w"), indent=1)
          PY
          mkdir -p ../../build/launcher-win ../../build/launcher-mac
          godot --headless --path . --export-release "Windows" ../../build/launcher-win/ProjectBokiLauncher.exe
          godot --headless --path . --export-release "macOS" ../../build/launcher-mac/ProjectBokiLauncher.zip
          (cd ../../build/launcher-win && zip -qr "$GITHUB_WORKSPACE/dist/ProjectBokiLauncher-windows.zip" .)
          cp ../../build/launcher-mac/ProjectBokiLauncher.zip "$GITHUB_WORKSPACE/dist/ProjectBokiLauncher-macos.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Project Boki ${{ steps.ver.outputs.tag }}
          prerelease: false
          files: dist/*
          body: |
            Playtest build. Get the **launcher** for your computer below (it keeps the game up to date):
            - Windows: ProjectBokiLauncher-windows.zip
            - Mac: ProjectBokiLauncher-macos.zip (first time: right-click the app → Open)
