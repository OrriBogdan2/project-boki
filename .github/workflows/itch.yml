# Uploads every build on main to itch.io (https://projectboki.itch.io/project-boki) for testers.
# Testers using the itch desktop app get each build as a small patch.
# One-time setup by the owner: repo Settings > Secrets and variables > Actions > New repository secret,
# name BUTLER_API_KEY, value = the itch.io API key (itch.io/user/settings/api-keys).
name: itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# A build takes tens of minutes and main moves every ~27 min on average: cancelling the running build for each
# push could starve itch of any finished build. Let the running one finish; GitHub keeps only the newest waiting.
concurrency:
  group: itch
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6.2"
  ITCH_TARGET: "projectboki/project-boki"

jobs:
  itch:
    # vars.RUNNER = self-hosted moves this job to our own Linux runners (labels self-hosted,linux,boki); unset = GitHub-hosted.
    runs-on: ${{ vars.RUNNER == 'self-hosted' && fromJSON('["self-hosted","linux","boki"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot, export templates and butler
        run: |
          set -e
          tools/ci/ci_env.sh --templates
          cache="${BOKI_CI_CACHE:-$HOME/.cache/boki-ci}"
          if [ ! -x "$cache/butler/butler" ]; then
            curl -fsSL --retry 3 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
            rm -rf "$cache/butler.new" && python3 -I -m zipfile -e butler.zip "$cache/butler.new" && chmod +x "$cache/butler.new/butler"
            rm -rf "$cache/butler" && mv "$cache/butler.new" "$cache/butler"
            rm -f butler.zip
          fi
          echo "$cache/butler" >> "$GITHUB_PATH"

      # Crash and error reporting (docs/SENTRY.md): the pinned Sentry addon, and the DSN secret written into
      # project.godot for this export only (no secret: the build keeps Sentry off).
      - name: Sentry addon and DSN
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -e
          tools/sentry_addon.sh
          python3 -I tools/sentry_dsn.py

      - name: Export Windows and macOS
        run: |
          # the build's commit, shown on the title screen next to the version, so a tester can tell which build they run
          sed -i "s|^config/name=.*|&\nconfig/version=\"$(git log -1 --format=%h)\"|" project.godot
          godot --headless --path . --import || true
          rm -rf ../build   # a self-hosted runner keeps the previous run's files here
          mkdir -p ../build/win ../build/mac
          godot --headless --path . --export-release "Windows" ../build/win/ProjectBoki.exe
          godot --headless --path . --export-release "macOS" ../build/mac/ProjectBoki.zip
          mkdir -p itch/windows itch/mac
          cp ../build/win/ProjectBoki.exe itch/windows/
          (cd itch/mac && unzip -q ../../../build/mac/ProjectBoki.zip)

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "::warning::BUTLER_API_KEY secret not set; skipping the upload"; exit 0; fi
          V=$(git log -1 --format=%h)
          butler push itch/windows "$ITCH_TARGET:windows" --userversion "$V"
          butler push itch/mac "$ITCH_TARGET:mac" --userversion "$V"
